<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fieldset & Legend</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <form>

        <!-- TITULO -->
        <h2>
            Formulario de Contacto
        </h2>

        <fieldset>
            <legend>Información Básica</legend>
            <!-- SIMPLE INPUTS -->
            <div class="form_input">
                <label for="nombre">Nombre Completo</label>
                <input type="text" placeholder="John Doe" id="nombre">
            </div>
            <div class="form_input">
                <label for="email">Email
                    <input type="email" placeholder="ejemplo@gmail.com" id="email">
                </label>
            </div>
            <div class="form_input">
                <label>Asunto
                    <input type="text" placeholder="El asunto de tu mensaje">
                </label>
            </div>
        </fieldset>
        

        <!-- SELECT & OPTION -->
        <div class="form_input">
            <label>Tipo de Usuario
                <select name="type-of-user" id="">
                    <option value="user1">Seguidor</option>
                    <option value="user2">Empresa</option>
                    <option value="user3">Otros</option>
                </select>
            </label>
        </div>


        <!-- DATALIST & OPTION -->
        <div class="form_input">
            <label>Referente
                <input list="referente" name="referente">
                <datalist id="referente" name="type-of-user" id="">
                    <option value="Soy Dalto">Descripción</option>
                    <option value="Una empresa"></option>
                    <option value="Un amigo"></option>
                </datalist>
            </label>
        </div>


        <!-- TEXTAREA -->
        <div class="form_input">
            <label for="mensaje">Mensaje</label>
            <textarea placeholder="Deja tu mensaje..." id="mensaje"></textarea>
        </div>
        <div class="form_input">
            <label>Acepto los términos y condiciones
                <input type="checkbox" class="checkbox">
            </label>
        </div>

    </form>

</body>
</html>
